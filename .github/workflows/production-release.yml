name: production-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit production version (must match gradle.properties)'
        type: string
        required: true
      apk_abi:
        description: 'Phone ARM64 or universal compatibility APK'
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - universal
        required: true
      publish_release:
        description: 'Publish a new GitHub Release and tag after all checks pass'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: pikminbee-production-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Require explicit main branch dispatch
        run: |
          test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate committed release version and signing certificate pin
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CERTIFICATE: ${{ vars.PIKMINBEE_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          python3 scripts/bump_version.py check
          python3 -m unittest discover -s scripts -p 'test_version*.py'
          python3 -m unittest discover -s scripts -p 'test_apk_size*.py'
          PYTHONPATH=scripts python3 -c 'import os,re; from pathlib import Path; from bump_version import production_version; from production_release import UAT_CERTIFICATE; assert str(production_version(Path("gradle.properties").read_text())) == os.environ["RELEASE_VERSION"], "Version mismatch"; pin=os.environ["RELEASE_CERTIFICATE"].strip().lower(); assert re.fullmatch(r"[0-9a-f]{64}", pin) and pin != UAT_CERTIFICATE, "Dedicated production certificate pin required"'
      - name: Verify shared source and release variant
        run: |
          node --test scripts/test_map_ui_policy.mjs scripts/test_coordinate_formats.mjs
          ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain
          PIKMINBEE_PRODUCTION=true ./gradlew :app:compileReleaseKotlin :app:lintRelease -PpikminbeeUnsignedProductionCheck=true --no-daemon --console=plain
      - name: Restore owner-provisioned production signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.PIKMINBEE_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Missing dedicated production signing key. No release will be published."
            exit 1
          fi
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pikminbee-production.p12"
          test -s "$RUNNER_TEMP/pikminbee-production.p12"
          echo "PIKMINBEE_RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/pikminbee-production.p12" >> "$GITHUB_ENV"
      - name: Build non-debuggable production APK
        env:
          PIKMINBEE_PRODUCTION: 'true'
          PIKMINBEE_RELEASE_SIGN_PASSWORD: ${{ secrets.PIKMINBEE_RELEASE_SIGN_PASSWORD }}
          APK_ABI: ${{ inputs.apk_abi }}
        run: |
          set -euo pipefail
          test -n "$PIKMINBEE_RELEASE_SIGN_PASSWORD"
          ./gradlew :app:assembleRelease -PpikminbeeApkAbi="$APK_ABI" --no-daemon --console=plain
      - name: Verify actual package, version, signer and ABI
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CERTIFICATE: ${{ vars.PIKMINBEE_RELEASE_CERT_SHA256 }}
          APK_ABI: ${{ inputs.apk_abi }}
        run: |
          set -euo pipefail
          METADATA="app/build/outputs/apk/release/output-metadata.json"
          APK_NAME="$(PYTHONPATH=scripts python3 -c 'import json,os; from pathlib import Path; from bump_version import production_version; from production_release import validate_metadata; print(validate_metadata(json.loads(Path("app/build/outputs/apk/release/output-metadata.json").read_text()),production_version(Path("gradle.properties").read_text())))')"
          APK="app/build/outputs/apk/release/$APK_NAME"
          test -s "$APK"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SIGNER="$(find "$SDK_DIR/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_DIR/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -x "$SIGNER"
          test -x "$AAPT"
          "$SIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/production-cert.txt"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/production-badging.txt"
          python3 scripts/production_release.py \
            --metadata "$METADATA" --version "$RELEASE_VERSION" \
            --apk "$APK" --abi "$APK_ABI" \
            --badging "$RUNNER_TEMP/production-badging.txt" \
            --certificate-report "$RUNNER_TEMP/production-cert.txt" \
            --expected-certificate "$RELEASE_CERTIFICATE" \
            --source-sha "$GITHUB_SHA" --output dist/production
          (cd dist/production && sha256sum -- *.apk apk-size-report.json > SHA256SUMS.txt)
      - name: Remove temporary production key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/pikminbee-production.p12"
      - name: Upload verified signed release assets
        uses: actions/upload-artifact@v4
        with:
          name: PikminBee-PROD-${{ inputs.version }}-${{ inputs.apk_abi }}-signed
          path: dist/production/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: inputs.publish_release == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PikminBee-PROD-${{ inputs.version }}-${{ inputs.apk_abi }}-signed
          path: dist/production
      - name: Publish exact verified main commit without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          APK_ABI: ${{ inputs.apk_abi }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_VERSION" =~ ^[1-9][0-9]{0,2}\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]
          (cd dist/production && sha256sum -c SHA256SUMS.txt)
          python3 -c 'import json,os; from pathlib import Path; d=json.loads(Path("dist/production/apk-size-report.json").read_text()); assert d["source_sha"]==os.environ["GITHUB_SHA"]; assert d["version_name"]==os.environ["RELEASE_VERSION"]; assert d["application_id"]=="com.naos.pikminbee.prod"; assert d["debuggable"] is False'
          TAG="v$RELEASE_VERSION"
          # Creating the ref is atomic and fails if the tag already exists.
          # Never force-update or delete a previous production tag.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "PikminBee $RELEASE_VERSION" \
            --notes "Signed production APK ($APK_ABI). Separate from DEV and UAT; private app data is not migrated automatically. Automated build/signing checks passed. Device acceptance remains tracked in the linked issues." \
            dist/production/*.apk dist/production/apk-size-report.json dist/production/SHA256SUMS.txt
