name: android
on:
  pull_request:
    branches: [develop, staging, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check PR promotion direction
        if: github.event_name == 'pull_request'
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          case "$BASE:$HEAD" in
            develop:feature/*|develop:fix/*|develop:chore/*|staging:develop|main:staging) ;;
            *) echo "Invalid branch promotion: $HEAD -> $BASE"; exit 1 ;;
          esac
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Android app
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Manual test APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PikminBee-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
