plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def secrets = new Properties()
def secretsFile = rootProject.file('secrets.properties')
if (secretsFile.exists()) {
    secretsFile.withInputStream { secrets.load(it) }
}
def mapsKey = secrets.getProperty('GOOGLE_MAPS_API_KEY', '')

android {
    namespace 'com.naos.pikminbee'
    compileSdk 37

    defaultConfig {
        applicationId 'com.naos.pikminbee'
        minSdk 28
        targetSdk 36
        versionCode 2
        versionName '0.2.0-dev'
        manifestPlaceholders = [googleMapsKey: mapsKey]
        buildConfigField 'boolean', 'HAS_GOOGLE_MAPS_KEY', mapsKey.isBlank() ? 'false' : 'true'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug { }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.10.00')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'org.maplibre.gl:android-sdk:13.7.1'
    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    testImplementation 'junit:junit:4.13.2'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
