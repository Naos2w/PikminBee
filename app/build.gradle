plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def secrets = new Properties()
def secretsFile = rootProject.file('secrets.properties')
if (secretsFile.exists()) {
    secretsFile.withInputStream { secrets.load(it) }
}
def mapsKey = secrets.getProperty('GOOGLE_MAPS_API_KEY', '')

// Visible semantic versions are separate from Android installation versionCodes.
// Use scripts/bump_version.py dev|uat to advance each channel.
def devVersion = providers.gradleProperty('pikminbeeDevVersion').orNull
def uatVersion = providers.gradleProperty('pikminbeeUatVersion').orNull
def semanticVersion = ~/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/
if (devVersion == null || !(devVersion ==~ semanticVersion) ||
    uatVersion == null || !(uatVersion ==~ semanticVersion)) {
    throw new GradleException('DEV and UAT versions must be X.Y.Z in gradle.properties')
}
def devParts = devVersion.tokenize('.').collect { it.toInteger() }
def uatParts = uatVersion.tokenize('.').collect { it.toInteger() }
if (devParts[0] != uatParts[0] || devParts[1] != uatParts[1] ||
    devParts[2] <= uatParts[2]) {
    throw new GradleException('DEV must be a later patch than UAT in the same minor release')
}
if (devParts.any { it >= 1000 }) {
    throw new GradleException('Version components must be below 1000 for DEV versionCode')
}

// This separate, debug-only UAT package can coexist with older personal builds.
// Its signing key comes from private GitHub Actions secrets, never from source.
def isUat = System.getenv('PIKMINBEE_UAT') == 'true'
// The target phone uses arm64. Keep ordinary DEV universal and allow a
// deliberate alternative APK for other devices/emulators.
def apkAbi = providers.gradleProperty('pikminbeeApkAbi')
    .orElse(isUat ? 'arm64-v8a' : 'universal').get()
if (!(apkAbi in ['universal', 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'])) {
    throw new GradleException('Unsupported pikminbeeApkAbi: ' + apkAbi)
}
def uatStoreFile = System.getenv('PIKMINBEE_UAT_KEYSTORE_FILE')
def uatStorePassword = System.getenv('PIKMINBEE_UAT_SIGN_PASSWORD')
if (isUat && (!uatStoreFile || !uatStorePassword)) {
    throw new GradleException('UAT signing secrets are missing; refusing a rotating debug key')
}
// A fixed-signer UAT build shipped at versionCode 1051. The monotonically
// increasing GitHub workflow run number must remain above that installation.
def runNumber = System.getenv('GITHUB_RUN_NUMBER')
if (isUat && !(runNumber ==~ /[1-9]\d*/)) {
    throw new GradleException('Signed UAT builds require a positive GITHUB_RUN_NUMBER')
}
def uatInstallCode = isUat ? 1000L + runNumber.toLong() : 0L
if (isUat && (uatInstallCode <= 1051L || uatInstallCode > 2100000000L)) {
    throw new GradleException('UAT versionCode must exceed shipped 1051 and fit Android limits')
}
def devInstallCode = devParts[0] * 1_000_000 + devParts[1] * 1_000 + devParts[2]

android {
    namespace 'com.naos.pikminbee'
    compileSdk 37

    defaultConfig {
        applicationId 'com.naos.pikminbee'
        minSdk 28
        targetSdk 36
        versionCode isUat ? uatInstallCode.toInteger() : devInstallCode
        versionName isUat ? uatVersion : devVersion + "-dev"
        manifestPlaceholders = [
            googleMapsKey: mapsKey,
            appDisplayName: isUat ? 'PikminBee UAT' : 'PikminBee',
        ]
        buildConfigField 'boolean', 'HAS_GOOGLE_MAPS_KEY', mapsKey.isBlank() ? 'false' : 'true'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        if (apkAbi != 'universal') {
            ndk {
                abiFilters apkAbi
            }
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (isUat) {
            uat {
                storeFile file(uatStoreFile)
                storePassword uatStorePassword
                keyAlias 'pikminbee-uat'
                keyPassword uatStorePassword
            }
        }
    }

    buildTypes {
        debug {
            if (isUat) {
                applicationIdSuffix '.uat'
                signingConfig signingConfigs.uat
            }
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.10.00')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'org.maplibre.gl:android-sdk:13.7.1'
    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
